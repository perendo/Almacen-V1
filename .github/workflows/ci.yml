name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wms_user
          POSTGRES_PASSWORD: wms_password
          POSTGRES_DB: wms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wms_user -d wms_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://wms_user:wms_password@localhost:5432/wms_db
      SECRET_KEY: ci-only-9f4b7c2e5a1d8f3b6c0e4a7d2b9f5c1e
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:3000"]'
      ALLOWED_HOSTS: '["localhost","127.0.0.1","testserver"]'
      TRUST_PROXY_HEADERS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migraciones Alembic
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Seed de datos
        working-directory: backend
        run: python seed.py

      - name: Levantar API
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done

      - name: Pruebas de integración (42)
        working-directory: backend
        run: python -m pytest tests/test_integration.py -v

      - name: Pruebas de seguridad y aislamiento (113)
        working-directory: backend
        run: python -m pytest tests/test_security.py -v

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (incluye comprobación de tipos)
        run: npm run build

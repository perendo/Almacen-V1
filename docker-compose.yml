services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: wms_password
      POSTGRES_DB: wms_db
    volumes:
      - wms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_user -d wms_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://wms_user:wms_password@db:5432/wms_db
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY (>=32 caracteres) en el entorno}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: '["http://localhost:3000"]'
      ALLOWED_HOSTS: '["localhost","127.0.0.1","api"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  wms_pgdata:
